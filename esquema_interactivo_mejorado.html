<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Soldadura - Guante Traductor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
        }
        
        /* Interactive SVG Elements */
        .wire { 
            transition: stroke-width 0.2s ease, filter 0.2s ease; 
            cursor: pointer; 
        }
        .wire:hover { 
            stroke-width: 8; 
            filter: drop-shadow(0 0 6px currentColor) brightness(1.5); 
        }
        
        .node { 
            transition: all 0.2s ease; 
            cursor: pointer; 
            transform-origin: center;
        }
        .node:hover { 
            r: 12; 
            fill: #fde047; 
            stroke: #ca8a04;
            stroke-width: 4;
            filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.8)); 
        }

        .component {
            transition: filter 0.3s ease;
            cursor: help;
        }
        .component:hover {
            filter: drop-shadow(0 0 12px rgba(96, 165, 250, 0.4));
        }

        /* SVG Patterns & Gradients */
        svg {
            background-color: #020617;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen p-6 box-border">

    <!-- Header & Interactive Info Panel -->
    <div class="flex flex-col md:flex-row gap-6 mb-6 shrink-0 h-auto min-h-[140px]">
        
        <!-- Title Section -->
        <div class="flex-1 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex flex-col justify-center">
            <div class="flex items-center gap-3 mb-2">
                <span class="bg-teal-500/20 text-teal-400 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-teal-500/30">Sin Protoboard</span>
                <span class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-blue-500/30">Ortogonal</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Plano de Soldadura</h1>
            <p class="text-slate-400 font-medium mt-1">Guante Traductor: ESP32 + 5x Flex + MPU6050</p>
        </div>

        <!-- Dynamic Instructions Panel -->
        <div class="flex-[1.5] bg-slate-800/80 p-6 rounded-2xl border border-teal-500/40 shadow-[0_0_20px_rgba(20,184,166,0.15)] relative overflow-hidden backdrop-blur-sm flex flex-col justify-center">
            <div class="absolute top-0 left-0 w-1 h-full bg-teal-500"></div>
            <h2 id="info-title" class="font-bold text-teal-400 text-xl mb-2 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Interactúa con el Plano
            </h2>
            <p id="info-desc" class="text-slate-300 text-[15px] leading-relaxed font-medium">
                Pasa el cursor sobre las líneas de colores, los componentes, las resistencias o los <b>nodos amarillos</b> para ver las instrucciones exactas de soldadura y ensamblaje.
            </p>
        </div>

    </div>

    <!-- SVG Canvas -->
    <div class="flex-grow w-full bg-slate-950 rounded-2xl border border-slate-700 shadow-2xl overflow-auto flex items-center justify-center">
        <svg viewBox="0 0 1200 850" class="min-w-[1000px] w-full h-full" xmlns="http://www.w3.org/2000/svg">
            
            <defs>
                <linearGradient id="espGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#1e293b" />
                    <stop offset="100%" stopColor="#0f172a" />
                </linearGradient>
                <linearGradient id="mpuGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#172554" />
                    <stop offset="100%" stopColor="#1e3a8a" />
                </linearGradient>
                <pattern id="carbon" x="0" y="0" width="8" height="20" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="4" height="20" fill="#334155" />
                </pattern>
            </defs>

            <!-- ========================================== -->
            <!-- 1. BUSES PRINCIPALES (ALIMENTACIÓN)        -->
            <!-- ========================================== -->

            <!-- BUS GND (Gris Oscuro/Plata) -->
            <g class="wire" stroke="#94a3b8" stroke-width="6" fill="none"
               onmouseover="setInfo('BUS GND (Cable Gris/Negro)', 'Columna vertebral de Tierra. Saca un cable desde el pin GND de la ESP32. De este cable se conectarán 6 cosas: las 5 resistencias y el pin GND del MPU6050.')" onmouseout="resetInfo()">
                <!-- Salida de ESP32 -->
                <path d="M 250 260 H 380" />
                <!-- Columna Vertical -->
                <path d="M 380 140 V 740" />
                <!-- Ramificaciones a Resistencias -->
                <path d="M 380 140 H 600" />
                <path d="M 380 260 H 600" />
                <path d="M 380 380 H 600" />
                <path d="M 380 500 H 600" />
                <path d="M 380 620 H 600" />
                <!-- Ramificación a MPU6050 -->
                <path d="M 380 740 H 850" />
            </g>

            <!-- BUS 3.3V (Rojo) -->
            <g class="wire" stroke="#ef4444" stroke-width="6" fill="none"
               onmouseover="setInfo('BUS 3.3V (Cable Rojo)', 'Columna vertebral de Energía. Saca un cable desde el pin 3V3 de la ESP32. ¡OJO! No uses 5V/VIN. Este bus alimenta la Pata 1 de los 5 sensores Flex y el VCC del MPU6050.')" onmouseout="resetInfo()">
                <!-- Salida de ESP32 -->
                <path d="M 250 220 H 320" />
                <!-- Columna Vertical -->
                <path d="M 320 110 V 720" />
                <!-- Ramificaciones a Flex Pin 1 -->
                <path d="M 320 110 H 950" />
                <path d="M 320 230 H 950" />
                <path d="M 320 350 H 950" />
                <path d="M 320 470 H 950" />
                <path d="M 320 590 H 950" />
                <!-- Ramificación a MPU6050 -->
                <path d="M 320 720 H 850" />
            </g>

            <!-- Puntos de Conexión en los Buses (Nodos Negros/Rojos) -->
            <circle cx="380" cy="260" r="5" fill="#94a3b8" />
            <circle cx="320" cy="220" r="5" fill="#ef4444" />
            
            <circle cx="380" cy="140" r="4" fill="#94a3b8" /><circle cx="380" cy="380" r="4" fill="#94a3b8" /><circle cx="380" cy="500" r="4" fill="#94a3b8" /><circle cx="380" cy="620" r="4" fill="#94a3b8" /><circle cx="380" cy="740" r="4" fill="#94a3b8" />
            <circle cx="320" cy="110" r="4" fill="#ef4444" /><circle cx="320" cy="230" r="4" fill="#ef4444" /><circle cx="320" cy="350" r="4" fill="#ef4444" /><circle cx="320" cy="470" r="4" fill="#ef4444" /><circle cx="320" cy="590" r="4" fill="#ef4444" /><circle cx="320" cy="720" r="4" fill="#ef4444" />

            <!-- ========================================== -->
            <!-- 2. CABLES DE SEÑAL I2C (MPU6050)           -->
            <!-- ========================================== -->

            <!-- SDA (Pin 21) - Azul -->
            <path d="M 850 780 H 500 V 620 H 250" fill="none" stroke="#3b82f6" stroke-width="5" class="wire"
                  onmouseover="setInfo('Señal I2C - SDA (Azul)', 'Línea de Datos del MPU6050. Suelda un cable directo desde el pin SDA del módulo hasta el pin GPIO 21 de la ESP32.')" onmouseout="resetInfo()" />
            
            <!-- SCL (Pin 22) - Amarillo -->
            <path d="M 850 760 H 450 V 660 H 250" fill="none" stroke="#eab308" stroke-width="5" class="wire"
                  onmouseover="setInfo('Señal I2C - SCL (Amarillo)', 'Línea de Reloj del MPU6050. Suelda un cable directo desde el pin SCL del módulo hasta el pin GPIO 22 de la ESP32.')" onmouseout="resetInfo()" />


            <!-- ========================================== -->

            <!-- Base connection from Flex P2 to Resistor Right -->

            <path d="M 950 260 H 660" fill="none" stroke="#64748b" stroke-width="4" />
            <path d="M 950 380 H 660" fill="none" stroke="#64748b" stroke-width="4" />
            <path d="M 950 500 H 660" fill="none" stroke="#64748b" stroke-width="4" />
            <path d="M 950 620 H 660" fill="none" stroke="#64748b" stroke-width="4" />

            <!-- Pulgar (Pin 34) -->

            <!-- Índice (Pin 35) -->

                  onmouseover="setInfo('Señal Índice (Pin 35)', 'Cable que transporta la lectura variable del índice. Conecta el nodo de empalme central al GPIO 35.')" onmouseout="resetInfo()" />
            
            <!-- Medio (Pin 32) -->
            <path d="M 800 380 H 740 V 440 H 250" fill="none" stroke="#8b5cf6" stroke-width="5" class="wire"
                  onmouseover="setInfo('Señal Medio (Pin 32)', 'Cable que transporta la lectura variable del dedo medio. Conecta el nodo de empalme central al GPIO 32.')" onmouseout="resetInfo()" />
            
            <!-- Anular (Pin 33) -->
            <path d="M 800 500 H 720 V 500 H 250" fill="none" stroke="#f97316" stroke-width="5" class="wire"

            <!-- Meñique (Pin 25) -->

            <!-- NODOS AMARILLOS (SOLDADURAS CLAVE) -->
            <circle cx="800" cy="140" r="8" fill="#facc15" stroke="#a16207" stroke-width="2" class="node" 
                    onmouseover="setInfo('NODO DE EMPALME CENTRAL (Divisor de Voltaje)', '🔥 SOLDADURA CRÍTICA: Aquí debes unir 3 cables: 1) La pata 2 del Sensor Flex, 2) Una pata de la resistencia de 10k, y 3) El cable de señal de color que va a la ESP32. ¡Aísla con tubo termocontraíble!')" onmouseout="resetInfo()" />
            <circle cx="800" cy="260" r="8" fill="#facc15" stroke="#a16207" stroke-width="2" class="node" onmouseover="setInfo('NODO DE EMPALME CENTRAL (Divisor de Voltaje)', '🔥 SOLDADURA CRÍTICA: Aquí debes unir 3 cables: 1) La pata 2 del Sensor Flex, 2) Una pata de la resistencia de 10k, y 3) El cable de señal de color que va a la ESP32. ¡Aísla con tubo termocontraíble!')" onmouseout="resetInfo()" />
            <circle cx="800" cy="380" r="8" fill="#facc15" stroke="#a16207" stroke-width="2" class="node" onmouseover="setInfo('NODO DE EMPALME CENTRAL (Divisor de Voltaje)', '🔥 SOLDADURA CRÍTICA: Aquí debes unir 3 cables: 1) La pata 2 del Sensor Flex, 2) Una pata de la resistencia de 10k, y 3) El cable de señal de color que va a la ESP32. ¡Aísla con tubo termocontraíble!')" onmouseout="resetInfo()" />
            <circle cx="800" cy="500" r="8" fill="#facc15" stroke="#a16207" stroke-width="2" class="node" onmouseover="setInfo('NODO DE EMPALME CENTRAL (Divisor de Voltaje)', '🔥 SOLDADURA CRÍTICA: Aquí debes unir 3 cables: 1) La pata 2 del Sensor Flex, 2) Una pata de la resistencia de 10k, y 3) El cable de señal de color que va a la ESP32. ¡Aísla con tubo termocontraíble!')" onmouseout="resetInfo()" />
            <circle cx="800" cy="620" r="8" fill="#facc15" stroke="#a16207" stroke-width="2" class="node" onmouseover="setInfo('NODO DE EMPALME CENTRAL (Divisor de Voltaje)', '🔥 SOLDADURA CRÍTICA: Aquí debes unir 3 cables: 1) La pata 2 del Sensor Flex, 2) Una pata de la resistencia de 10k, y 3) El cable de señal de color que va a la ESP32. ¡Aísla con tubo termocontraíble!')" onmouseout="resetInfo()" />


            <!-- ========================================== -->
            <!-- 4. COMPONENTES FÍSICOS                     -->
            <!-- ========================================== -->

            <!-- ESP32 -->

               onmouseover="setInfo('Microcontrolador: ESP32 (WROOM-32)', 'El cerebro del sistema. Presta especial atención al orden de los pines de la derecha. Hemos distribuido los pines de manera óptima para no cruzar cables.')" onmouseout="resetInfo()">

                <rect x="60" y="40" width="80" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
                <text x="100" y="85" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">ESP32</text>
                
                <!-- Pines Derechos ESP32 -->
                <!-- 3V3 -->
                <g transform="translate(200, 20)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="end">3V3</text></g>
                <!-- GND -->
                <g transform="translate(200, 60)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="end">GND</text></g>
                <!-- 34 -->
                <g transform="translate(200, 120)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#10b981" font-size="14" font-weight="bold" text-anchor="end">34</text></g>
                <!-- 35 -->
                <g transform="translate(200, 180)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#06b6d4" font-size="14" font-weight="bold" text-anchor="end">35</text></g>
                <!-- 32 -->
                <g transform="translate(200, 240)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="end">32</text></g>
                <!-- 33 -->
                <g transform="translate(200, 300)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#f97316" font-size="14" font-weight="bold" text-anchor="end">33</text></g>
                <!-- 25 -->
                <g transform="translate(200, 360)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#ec4899" font-size="14" font-weight="bold" text-anchor="end">25</text></g>
                <!-- 21 (SDA) -->
                <g transform="translate(200, 420)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#3b82f6" font-size="14" font-weight="bold" text-anchor="end">21</text></g>
                <!-- 22 (SCL) -->
                <g transform="translate(200, 460)"><rect x="-6" y="-6" width="12" height="12" fill="#cbd5e1" /><text x="-16" y="5" fill="#eab308" font-size="14" font-weight="bold" text-anchor="end">22</text></g>
            </g>

            <!-- 5 RESISTENCIAS DE 10K -->

                <rect x="10" y="0" width="5" height="16" fill="#78350f" /><rect x="25" y="0" width="5" height="16" fill="#000000" /><rect x="40" y="0" width="5" height="16" fill="#ea580c" />

                <rect x="10" y="0" width="5" height="16" fill="#78350f" /><rect x="25" y="0" width="5" height="16" fill="#000000" /><rect x="40" y="0" width="5" height="16" fill="#ea580c" />

                <text x="30" y="-8" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">10 kΩ</text>

            <!-- 5 SENSORES FLEX (Lado Derecho) -->

            <g transform="translate(950, 100)" class="component" onmouseover="setInfo('Sensor Flex - Dedo Pulgar', 'Sus patas NO tienen polaridad. Conecta la Pata Superior al BUS 3.3V, y la Pata Inferior al Nodo Amarillo de Empalme. NO apliques silicona caliente sobre el plástico.')" onmouseout="resetInfo()">

    <!-- Lógica de Interacción -->
    <script>
        const defaultTitle = `<svg class="w-6 h-6 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Interactúa con el Plano`;
        const defaultDesc = `Pasa el cursor sobre las líneas de colores, los componentes, las resistencias o los <b>nodos amarillos</b> para ver las instrucciones exactas de soldadura y ensamblaje.`;

        function setInfo(title, description) {
            const titleEl = document.getElementById('info-title');
            const descEl = document.getElementById('info-desc');
            
            titleEl.innerHTML = title;
            titleEl.classList.remove('text-teal-400');
            titleEl.classList.add('text-white');
            
            descEl.innerHTML = description;
            descEl.classList.remove('text-slate-300');
            descEl.classList.add('text-teal-50');
        }

        function resetInfo() {
            const titleEl = document.getElementById('info-title');
            const descEl = document.getElementById('info-desc');
            
            titleEl.innerHTML = defaultTitle;
            titleEl.classList.add('text-teal-400');
            titleEl.classList.remove('text-white');
            
            descEl.innerHTML = defaultDesc;
            descEl.classList.add('text-slate-300');
            descEl.classList.remove('text-teal-50');
        }
    </script>
</body>
